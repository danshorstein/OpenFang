[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openfang"
version = "0.1.0"
description = "LLMs write automations, not be automations. A fork of OpenClaw."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "OpenFang Contributors" },
]
keywords = ["ai", "automation", "mcp", "agents", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pydantic>=2.0",
    "mcp>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
openfang = "openfang.cli:main"

[project.urls]
Homepage = "https://github.com/openfang/openfang"
Repository = "https://github.com/openfang/openfang"

[tool.hatch.build.targets.wheel]
packages = ["openfang"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
